name: Build Bottles

on:
  push:
    paths:
      - 'Formula/*.rb'
  workflow_dispatch:

jobs:
  bottle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Tap and build bottle
        run: |
          # Link this checkout into Homebrew's tap directory
          TAP_DIR="$(brew --repository)/Library/Taps/thetom/homebrew-tap"
          rm -rf "$TAP_DIR"
          ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"

          # Build the formula as a bottle
          brew install --build-bottle TheTom/tap/vllm-swift

          # Create the bottle tarball
          brew bottle --json --root-url="https://github.com/TheTom/homebrew-tap/releases/download/bottles" TheTom/tap/vllm-swift

      - name: Upload bottle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bottle
          path: |
            *.bottle.*
            *.json

      - name: Create release and upload bottle
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create or update the bottles release
          gh release create bottles --title "Bottles" --notes "Prebuilt Homebrew bottles" 2>/dev/null || true

          # Upload bottle files
          for f in *.bottle.tar.gz; do
            [ -f "$f" ] || continue
            gh release upload bottles "$f" --clobber
          done
